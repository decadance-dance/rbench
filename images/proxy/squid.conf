# The trial proxy (design.md D3, spec trial-isolation: Network only through the allowlist).
# Allowed: CONNECT to port 443 of a host listed in /etc/squid/allowlist, by name only.
# Refused: everything else, plain HTTP and numeric destinations included.
http_port 3128
cache deny all

# One line per request, allowed or refused: time, client, squid result/HTTP status, method,
# request target, the address squid connected to ("-" when it did not). The audit reads this log.
# The image's health check, a request from inside the proxy container, is left out.
acl self src 127.0.0.1/32
logformat rbench %ts.%03tu %>a %Ss/%03>Hs %rm %ru %<a
access_log stdio:/var/log/squid/access.log rbench !self
cache_log stdio:/dev/stderr
logfile_rotate 0

acl SSL_ports port 443
acl CONNECT method CONNECT
# -n: never match a numeric destination by its reverse DNS name (PR #105 review M1).
acl allowed dstdomain -n "/etc/squid/allowlist"
http_access allow CONNECT SSL_ports allowed
http_access deny all

via off
forwarded_for delete
