name: ci
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The manifest history check reads each task set's manifest at the merge base with the
          # PR's base branch.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: bin/check
